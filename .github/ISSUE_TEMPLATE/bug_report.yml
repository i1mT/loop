name: Bug report
description: Report a reproducible problem in Loop.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or unredacted logs. Use the private security reporting process for vulnerabilities.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, OS, Node version, agent, and gateway mode.
