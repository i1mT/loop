# 网关部署。数据库与对象存储默认用 .env 里配置的外部服务（云上 PostgreSQL / S3）。
# 在仓库根目录执行：
#   cp config/node.env.example .env
#   docker compose up -d --build                     # 只起网关，连 .env 指定的外部服务
#   docker compose --profile builtin up -d --build   # 额外起内置 Postgres 与 MinIO（本机试用）
# 内置服务的口令只用于本机演示，必须替换；生产请用受管数据库与对象存储。
#
# 放在仓库根是有意的：env_file 与 build.context 都相对本文件所在目录解析，
# 这样 .env 就在根目录，构建上下文也正是 Dockerfile 需要的仓库根。
services:
  gateway:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      # 服务名在同一网络内可直接解析；改用外部数据库时在 .env 里覆盖 DATABASE_URL。
      DATABASE_URL: ${DATABASE_URL:-postgres://loop:loop@postgres:5432/loop}
      S3_BUCKET: ${S3_BUCKET:-loop-files}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # 容器内监听端口；端口映射与健康检查都跟着同一个值走，改 .env 的 PORT 即可。
      PORT: ${PORT:-3000}
    ports:
      # 左右两侧用同一个 PORT：容器监听什么端口，宿主机就映射什么端口。
      - "${PORT:-3000}:${PORT:-3000}"
    # 不依赖内置服务：默认连 .env 里的外部数据库与对象存储。
    # 需要内置服务时用 --profile builtin 启动，compose 会按健康检查等待它们。
    restart: unless-stopped

  # 仅本机试用：docker compose --profile builtin up -d
  postgres:
    profiles: ["builtin"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loop}
      POSTGRES_DB: ${POSTGRES_DB:-loop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loop} -d ${POSTGRES_DB:-loop}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    profiles: ["builtin"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loop-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 20
      # 官方镜像自带 mc；用 readiness 探测避免容器起来但还没能接受请求。
      test: ["CMD-SHELL", "mc ready local"]
    restart: unless-stopped

  # 一次性任务：启动时创建桶，退出即结束。桶已存在时命令失败但不影响其它服务。
  minio-init:
    profiles: ["builtin"]
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-loop} ${MINIO_ROOT_PASSWORD:-loop-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-loop-files}
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
