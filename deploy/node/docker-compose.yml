# 单机部署示例：网关 + Postgres + MinIO。生产环境请把数据库与对象存储换成托管服务，
# 按自己的备份、鉴权与网络策略配置；这里的口令只用于本机演示，必须替换。
services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      # 服务名在同一网络内可直接解析；改用外部数据库时删掉 DATABASE_URL 覆盖。
      DATABASE_URL: ${DATABASE_URL:-postgres://loop:loop@postgres:5432/loop}
      S3_BUCKET: ${S3_BUCKET:-loop-files}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${LOOP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loop}
      POSTGRES_DB: ${POSTGRES_DB:-loop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loop} -d ${POSTGRES_DB:-loop}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-loop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-loop-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # 一次性任务：启动时创建桶，退出即结束。桶已存在时命令会失败，可安全忽略。
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-loop} ${MINIO_ROOT_PASSWORD:-loop-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-loop-files}
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
